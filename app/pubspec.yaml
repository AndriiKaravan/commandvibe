name: commandvibe
description: CommandVibe — group photo challenge (Web, Android, iOS).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  ks_core:
    git:
      url: git@github.com:AndriiKaravan/ks_core.git
      ref: v0.8.0
  app_links: ^7.0.0
  firebase_core: ^4.15.2
  flutter_secure_storage: ">=9.0.0 <12.0.0"
  go_router: ^17.5.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  share_plus: ">=10.0.0 <13.0.0"
  shared_preferences: ^2.5.6
  web: ^1.1.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
